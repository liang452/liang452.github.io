on:
  push:
    branches: [ main ]
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: install dependencies
        run: npm ci
        working-directory: ./app

      - name: build
        run: npm run build
        working-directory: ./app/dist
        
      - name: deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
      - name: build docker image
        run: docker build -t liang452-site .

      - name: Test container
        run: |
          docker run -d -p 8080:80 --name test-container liang452-site
          sleep 5
          curl localhost:8080
          docker stop test-container
